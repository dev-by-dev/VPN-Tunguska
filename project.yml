name: Tunguska

options:
  bundleIdPrefix: dev.tunguska.macos
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    ENABLE_HARDENED_RUNTIME: YES
    TUNGUSKA_KEYCHAIN_ACCESS_GROUP: $(AppIdentifierPrefix)dev.tunguska.macos.shared

targets:
  TunguskaCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/TunguskaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tunguska.macos.core
        PRODUCT_NAME: TunguskaCore
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  Tunguska:
    type: application
    platform: macOS
    sources:
      - path: Sources/Tunguska
      - path: Resources
        buildPhase: resources
    dependencies:
      - target: TunguskaCore
      - target: TunguskaTunnel
    info:
      path: Config/Tunguska-Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: Tunguska
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: 1
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSPrincipalClass: NSApplication
        NSMainNibFile: ""
        TunguskaKeychainAccessGroup: $(TUNGUSKA_KEYCHAIN_ACCESS_GROUP)
    entitlements:
      path: Config/Tunguska.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)dev.tunguska.macos.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tunguska.macos
        CODE_SIGN_ENTITLEMENTS: Config/Tunguska.entitlements
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  TunguskaTunnel:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/TunguskaTunnel
    dependencies:
      - target: TunguskaCore
      - framework: Vendor/Libbox.xcframework
        embed: false
        codeSign: false
      - sdk: AppKit.framework
      - sdk: SystemConfiguration.framework
      - sdk: ApplicationServices.framework
      - sdk: CoreText.framework
      - sdk: libbsm.tbd
      - sdk: libresolv.tbd
    info:
      path: Config/TunguskaTunnel-Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: Tunguska Tunnel
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: 1
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        TunguskaKeychainAccessGroup: $(TUNGUSKA_KEYCHAIN_ACCESS_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: Config/TunguskaTunnel.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.developer.networking.networkextension: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)dev.tunguska.macos.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tunguska.macos.TunguskaTunnel
        CODE_SIGN_ENTITLEMENTS: Config/TunguskaTunnel.entitlements
        SKIP_INSTALL: YES

  TunguskaCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/TunguskaCoreTests
    dependencies:
      - target: TunguskaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tunguska.macos.core.tests
        GENERATE_INFOPLIST_FILE: YES
